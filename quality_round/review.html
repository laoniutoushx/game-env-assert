<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>环境场景画质对照</title>
<style>body{max-width:1450px;margin:24px auto;padding:0 20px;background:#151a18;color:#e7e9e4;font:16px/1.6 system-ui}h1{font-size:24px}button{background:#28342e;color:inherit;border:1px solid #65776b;border-radius:6px;padding:7px 12px;margin:4px;cursor:pointer}button.active{background:#47654c}.compare{position:relative;aspect-ratio:1421/736;margin:16px 0;overflow:hidden;background:#000}.compare img{position:absolute;width:100%;height:100%;object-fit:contain}.after{clip-path:inset(0 0 0 50%)}.line{position:absolute;height:100%;left:50%;border-left:2px solid #fff;pointer-events:none}input{width:100%}a{color:#b9d8bd}.note{color:#b6c0b8;font-size:14px}.labels{display:flex;justify-content:space-between}</style>
<h1>环境场景画质对照</h1><p>拖动分割线比较原基线与本轮结果。主视角和实际输出均固定为 1421 × 736。</p>
<nav id="modes"></nav><div class="labels"><span>原始基线</span><span id="label">本轮合成结果</span></div>
<div class="compare"><img src="before/trial_top.png" alt="原始基线"><img class="after" id="after" src="all_top.png" alt="本轮对照"><div class="line" id="line"></div></div>
<input id="slider" type="range" min="0" max="100" value="50" aria-label="前后对照分割位置">
<p class="note">分项图用于诊断影响，部分早期试验参数与最终采用值不同；最终效果以“本轮合成结果”、侧视和近景为准。当前仍未达到概念图 90% 还原目标。</p>
<p><a href="all_side.png">侧俯视</a> · <a href="all_close.png">近景</a> · <a href="benchmark.json">性能记录</a> · <a href="root_cause_report.md">根因与修复记录</a> · <a href="../quality_assets/catalog.json">资产条目</a></p>
<script>const modes={'本轮合成结果':'all_top.png','光照对照':'lighting_top.png','材质对照':'materials_top.png','布局对照':'layout_top.png','模型对照':'assets_top.png','采样对照':'render_top.png'};for(const [label,path]of Object.entries(modes)){const b=document.createElement('button');b.textContent=label;if(label==='本轮合成结果')b.className='active';b.onclick=()=>{document.getElementById('after').src=path;document.getElementById('label').textContent=label;document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};document.getElementById('modes').appendChild(b)}document.getElementById('slider').oninput=e=>{const p=e.target.value;document.getElementById('after').style.clipPath=`inset(0 0 0 ${p}%)`;document.getElementById('line').style.left=p+'%'};</script></html>
